<!DOCTYPE html>
<html lang="en-ca">
  <head>
    <meta charset="UTF-8">
    <title>GBDA 228 A3</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dynalight&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Prata&display=swap" rel="stylesheet">


    <style>
      body {
        font-family: "montserrant", serif;
        font-weight: 400;
        font-style: normal;
        text-align: center;
        align-items: center;
        background-color: ivory;
      }

      .accent {
        font-family: "dynalight", sans-serif; 
        font-weight: 600;
        font-size: 80px;
        color: FEFAE1;
      }

      h1 {
        font-family: "prata";
        font-size: 80px;
      }

      nav ul {
        font-weight: 700;
        list-style: none;
        margin: 0;
        padding: 0;

      }

      nav li {
        display: inline-block;
        margin-right: 20px;

      }

      nav a {
        text-decoration: none;
      }

      nav a:hover {
        color: gray;
      }

      footer {
        padding: 10px;
        background-color: 41232F;
        bottom: 0;
        text-align: center;
        width: 100%;

      }
      img {
        max-width: 1400px;
        height: auto;
      }

      .container {
        display: grid;
        grid-template-columns: 100%;
        gap: 2%;
        margin: 2%;
      }

    </style>
  </head>
  <body>

    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Cafes</a></li>
        <li><a href="#">Restaurants</a></li>
      </ul>
    </nav>

    <div class="container">
      <div class="grid-item">
        <img src="hero.png" alt="title Vanessa's Favorites 2026, background of open envelope with paper sticking out">
        <img src="divider.png" alt="thin divder with repeated text">
      </div>
      <div class="grid-item">
        <h1>Food Reviews</h1>
      </div>
    </div>
    <footer>
      <h1 class="accent">
        Vanessa Phung
      </h1>
      <p>Let's Connect!</p>
    </footer>

  </body>
</html>
